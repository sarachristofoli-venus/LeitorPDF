<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; connect-src 'self' blob: data:">
  <title>Leitor PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="no-doc">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.5 6.5 0 0 0 10 10z"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
      <symbol id="i-present" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10 8v5l4.5-2.5z" fill="currentColor"/></symbol>
      <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.6M12 17v.01"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4a1 1 0 0 1 1-1h10l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M9 4h1.5A1.5 1.5 0 0 1 12 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9M15 4h-1.5A1.5 1.5 0 0 0 12 5.5v13a1.5 1.5 0 0 0 1.5 1.5H15M10 12h4"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7.5a6.5 6.5 0 0 1-6.5 6.5h-.8a6 6 0 0 1-4.9-2.6L3.8 15a1.6 1.6 0 0 1 2.6-1.9L8 15"/></symbol>
      <symbol id="i-marker" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-8 8H7.5l-1 1H4l2.5-3.5V11.5z"/><path d="M9.5 9.5l5 5"/></symbol>
      <symbol id="i-underline" viewBox="0 0 24 24"><path d="M7 4v6.5a5 5 0 0 0 10 0V4M5 20h14"/></symbol>
      <symbol id="i-strike" viewBox="0 0 24 24"><path d="M4 12h16M16.5 7c-.6-1.8-2.4-3-4.5-3-2.6 0-4.5 1.4-4.5 3.4 0 1.3.8 2.2 2.1 2.9M7.5 17c.6 1.8 2.4 3 4.5 3 2.6 0 4.5-1.4 4.5-3.4 0-.6-.1-1.1-.4-1.6"/></symbol>
      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v10l-5 5H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 20v-4a1 1 0 0 1 1-1h4M8 9h8M8 12.5h5"/></symbol>
      <symbol id="i-note-lines" viewBox="0 0 24 24"><path d="M6 8h12M6 12h12M6 16h8"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-ocr" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8.5 9h7M12 9v7"/></symbol>
      <symbol id="i-images" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 5V4a1 1 0 0 1 1-1h11a2 2 0 0 1 2 2v11a1 1 0 0 1-1 1h-3"/><path d="M3 15l4-4 4 4 2-2 4 4"/><circle cx="12.5" cy="9.5" r="1.3"/></symbol>
      <symbol id="i-rot-left" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></symbol>
    </defs>
  </svg>

  <header id="chrome">
    <div id="tabbar">
      <div id="tabs" role="tablist"></div>
      <button id="btnNewTab" class="icon-btn small" title="Abrir PDF (Ctrl+O)"><svg><use href="#i-plus"/></svg></button>
    </div>

    <div id="toolbar">
      <div class="group">
        <button id="btnSidebar" class="icon-btn needs-doc" title="Painel lateral (Ctrl+B)"><svg><use href="#i-sidebar"/></svg></button>
        <button id="btnOpen" class="icon-btn" title="Abrir PDF (Ctrl+O)"><svg><use href="#i-open"/></svg></button>
        <button id="btnSave" class="icon-btn needs-doc" title="Salvar anotações (Ctrl+S)" disabled><svg><use href="#i-save"/></svg></button>
        <span class="sep"></span>
        <button id="btnPrev" class="icon-btn needs-doc" title="Página anterior"><svg><use href="#i-up"/></svg></button>
        <button id="btnNext" class="icon-btn needs-doc" title="Próxima página"><svg><use href="#i-down"/></svg></button>
        <input id="pageInput" class="needs-doc" type="text" inputmode="numeric" value="" title="Ir para a página (Ctrl+G)" aria-label="Página atual">
        <span id="pageCount" class="muted">/ 0</span>
      </div>

      <div class="group">
        <button id="btnZoomOut" class="icon-btn needs-doc" title="Diminuir zoom (Ctrl+−)"><svg><use href="#i-minus"/></svg></button>
        <select id="zoomSelect" class="needs-doc" title="Zoom" aria-label="Zoom">
          <option value="auto">Automático</option>
          <option value="page-width">Ajustar à largura</option>
          <option value="page-fit">Página inteira</option>
          <option disabled>──────────</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
          <option value="4">400%</option>
          <option id="zoomCustom" value="custom" hidden></option>
        </select>
        <button id="btnZoomIn" class="icon-btn needs-doc" title="Aumentar zoom (Ctrl++)"><svg><use href="#i-plus"/></svg></button>
        <span class="sep"></span>
        <button id="btnRotate" class="icon-btn needs-doc" title="Girar no sentido horário (Ctrl+R)"><svg><use href="#i-rotate"/></svg></button>
        <span class="sep"></span>
        <button id="btnToolSelect" class="icon-btn needs-doc" title="Selecionar texto (V)"><svg><use href="#i-cursor"/></svg></button>
        <button id="btnToolHand" class="icon-btn needs-doc" title="Mão: arrastar a página (H)"><svg><use href="#i-hand"/></svg></button>
        <button id="btnToolHighlight" class="icon-btn needs-doc marker-btn" title="Marca-texto: marque o texto ao selecionar (M)"><svg><use href="#i-marker"/></svg></button>
        <button id="btnToolNote" class="icon-btn needs-doc" title="Adicionar nota (N)"><svg><use href="#i-note"/></svg></button>
        <span class="sep"></span>
        <button id="btnOcr" class="icon-btn needs-doc" title="Reconhecer texto — OCR (Ctrl+Shift+O)"><svg><use href="#i-ocr"/></svg></button>
      </div>

      <div class="group">
        <button id="btnSearch" class="icon-btn needs-doc" title="Buscar (Ctrl+F)"><svg><use href="#i-search"/></svg></button>
        <button id="btnNight" class="icon-btn needs-doc" title="Modo noturno para as páginas (Ctrl+Shift+N)"><svg><use href="#i-moon"/></svg></button>
        <button id="btnTheme" class="icon-btn" title="Tema"><svg><use href="#i-theme"/></svg></button>
        <span class="sep"></span>
        <button id="btnPresent" class="icon-btn needs-doc" title="Modo apresentação (F5)"><svg><use href="#i-present"/></svg></button>
        <button id="btnFullscreen" class="icon-btn" title="Tela cheia (F11)"><svg><use href="#i-fullscreen"/></svg></button>
        <button id="btnPrint" class="icon-btn needs-doc" title="Imprimir (Ctrl+P)"><svg><use href="#i-print"/></svg></button>
        <button id="btnInfo" class="icon-btn needs-doc" title="Propriedades do documento (Ctrl+D)"><svg><use href="#i-info"/></svg></button>
        <button id="btnHelp" class="icon-btn" title="Atalhos de teclado (F1)"><svg><use href="#i-help"/></svg></button>
      </div>
    </div>

    <div id="searchbar" hidden>
      <svg class="lead"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="Buscar no documento…" spellcheck="false" aria-label="Buscar no documento">
      <span id="searchStatus" class="muted"></span>
      <button id="searchPrev" class="icon-btn small" title="Anterior (Shift+Enter)"><svg><use href="#i-up"/></svg></button>
      <button id="searchNext" class="icon-btn small" title="Próximo (Enter)"><svg><use href="#i-down"/></svg></button>
      <label class="check"><input id="searchCase" type="checkbox"> Diferenciar maiúsculas</label>
      <button id="searchClose" class="icon-btn small" title="Fechar (Esc)"><svg><use href="#i-close"/></svg></button>
    </div>
  </header>

  <main id="main">
    <aside id="sidebar">
      <div id="sideTabs" role="tablist">
        <button data-side="thumbs" role="tab">Miniaturas</button>
        <button data-side="outline" role="tab">Sumário</button>
        <button data-side="annots" role="tab">Anotações <span id="annotCount" class="badge"></span></button>
      </div>
      <div id="sideContent"></div>
    </aside>
    <section id="viewerHost"></section>

    <section id="home">
      <div class="home-inner">
        <div class="brand">
          <img src="../build/icon.png" alt="" width="72" height="72">
          <div>
            <h1>Leitor PDF</h1>
            <p class="muted">Leve, rápido e sem distrações.</p>
          </div>
        </div>
        <div class="home-actions">
          <button id="homeOpen" class="primary"><svg><use href="#i-open"/></svg> Abrir PDF…</button>
          <button id="homeImages" class="secondary"><svg><use href="#i-images"/></svg> Criar PDF a partir de imagens…</button>
        </div>
        <p class="muted hint">ou arraste PDFs ou imagens (JPG, PNG) para esta janela</p>
        <div id="recentWrap">
          <h2>Recentes</h2>
          <ul id="recentList"></ul>
        </div>
      </div>
    </section>
  </main>

  <div id="dropOverlay" hidden><div>Solte para abrir (PDF ou imagens)</div></div>
  <div id="modalBack" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
  <div id="selBar" hidden></div>
  <div id="annotPop" hidden></div>
  <div id="ctxMenu" hidden></div>
  <div id="toast" hidden></div>
  <div id="printArea"></div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
